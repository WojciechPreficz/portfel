name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment while it is changing files on the server.
concurrency:
  group: portfel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Test backend
        working-directory: backend
        env:
          PYTHONPATH: .
          PORTFEL_AUTH_DISABLED: 'true'
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests -q

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to cPanel
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PYTHON: ${{ vars.DEPLOY_PYTHON }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy.sh

      - name: Check application after restart
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 5 --connect-timeout 10 --max-time 30 \
            https://portfel.preficze.pl/ -o /dev/null
          for attempt in {1..6}; do
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              -o /dev/null -w '%{http_code}' https://portfel.preficze.pl/api/auth/me) || status=000
            if [[ "$status" == 401 ]]; then
              exit 0
            fi
            echo "Expected HTTP 401 from /api/auth/me, received $status (attempt $attempt)."
            sleep 5
          done
          exit 1
